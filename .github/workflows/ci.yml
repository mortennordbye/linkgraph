name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Test (pytest)
        run: uv run pytest -q
      # The suite uses TestClient. This boots the real server the way start.sh does and checks
      # that the page, the vendored library and the API answer on 127.0.0.1.
      - name: Smoke-test the server
        run: |
          mkdir -p /tmp/dl/LinkedIn_smoke
          printf 'First Name,Last Name,URL,Email Address,Company,Position,Connected On\nA,B,https://www.linkedin.com/in/ab,,Acme AS,CTO,01 Jan 2024\n' \
            > /tmp/dl/LinkedIn_smoke/Connections.csv
          LINKGRAPH_DOWNLOADS=/tmp/dl uv run python -m linkgraph.server --no-browser --port 8765 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/sources >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/ | grep -q '<title>LinkGraph</title>'
          curl -sf -o /dev/null http://127.0.0.1:8765/static/vendor/force-graph.min.js
          curl -sf http://127.0.0.1:8765/api/data | grep -q '"connections":1'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:8765/api/data)" = 400

  # Kargo promotes what this pushes. It selects on the `0.0.<run_number>` tag, because SHA tags
  # have no order a registry watcher can sort. PRs build to catch Dockerfile breakage, never push.
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    # A red suite must never publish an image Kargo would then promote.
    needs: python
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The docker-container driver is required for the GHA cache backend.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=0.0.${{ github.run_number }},enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Off on purpose: with provenance, the prune below deletes the untagged attestation and
          # leaves a tag Kargo cannot resolve (seen in reelsmith).
          provenance: false

  prune:
    name: Prune old images
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: linkgraph
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 20
