<!-- linkgraph: a small network on a blue tile. Orange "me" node, blue company hubs, magenta decision-makers. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="linkgraph: a network graph with one highlighted warm path">
  <title>linkgraph</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F6FDE"/>
      <stop offset="1" stop-color="#0B1D4A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="me" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#FFC09A"/>
      <stop offset=".55" stop-color="#F07A3E"/>
      <stop offset="1" stop-color="#B8481A"/>
    </radialGradient>
    <radialGradient id="co" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#DCE7FB"/>
      <stop offset="1" stop-color="#9DB6E6"/>
    </radialGradient>
    <radialGradient id="dm" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#FF9FC9"/>
      <stop offset=".6" stop-color="#E0458C"/>
      <stop offset="1" stop-color="#9C1F58"/>
    </radialGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020a1f" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>

  <!-- links: faint network -->
  <g stroke="#fff" stroke-opacity=".28" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M226 290 L126 196"/>
    <path d="M226 290 L150 392"/>
    <path d="M126 196 L92 120"/>
    <path d="M126 196 L196 112"/>
    <path d="M150 392 L84 420"/>
    <path d="M150 392 L236 430"/>
    <path d="M346 196 L300 110"/>
    <path d="M346 196 L424 252"/>
  </g>
  <!-- the warm path: me -> company -> decision-maker -->
  <g stroke="#FFD27A" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M226 290 L346 196"/>
    <path d="M346 196 L410 120"/>
  </g>

  <g filter="url(#drop)">
    <!-- people -->
    <circle cx="92" cy="120" r="17" fill="url(#co)" fill-opacity=".85"/>
    <circle cx="196" cy="112" r="17" fill="url(#co)" fill-opacity=".85"/>
    <circle cx="84" cy="420" r="17" fill="url(#co)" fill-opacity=".85"/>
    <circle cx="300" cy="110" r="17" fill="url(#co)" fill-opacity=".85"/>
    <circle cx="424" cy="252" r="17" fill="url(#co)" fill-opacity=".85"/>
    <circle cx="236" cy="430" r="22" fill="url(#dm)"/>
    <circle cx="410" cy="120" r="30" fill="url(#dm)"/>
    <!-- companies -->
    <circle cx="126" cy="196" r="36" fill="url(#co)"/>
    <circle cx="150" cy="392" r="32" fill="url(#co)"/>
    <circle cx="346" cy="196" r="46" fill="url(#co)"/>
    <!-- me -->
    <circle cx="226" cy="290" r="54" fill="url(#me)"/>
  </g>
  <circle cx="210" cy="272" r="16" fill="#fff" fill-opacity=".35"/>

  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="url(#edge)" stroke-width="3"/>
</svg>
