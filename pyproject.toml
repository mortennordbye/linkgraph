[project]
name = "linkgraph"
version = "0.1.0"
description = "Local-first explorer for your LinkedIn data export"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "truststore>=0.10",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E501"]  # CSV fixture rows
