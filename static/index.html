<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
  <meta name="referrer" content="no-referrer">
  <title>LinkGraph</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="dot"></span>LinkGraph</div>
    <nav class="tabs">
      <a href="#/companies" data-view="companies">Companies</a>
      <a href="#/graph" data-view="graph">Graph</a>
      <a href="#/paths" data-view="paths">Warm Paths</a>
    </nav>
    <div class="spacer"></div>
    <span class="stats" id="stats"></span>
    <div class="source">
      <label for="source-select">Export</label>
      <select id="source-select"></select>
      <button id="source-other" title="Use another folder or zip path">…</button>
    </div>
    <button id="logo-btn" title="Opt-in: look up company logos. Asks before sending anything.">Fetch logos</button>
    <span class="privacy" title="All data stays on this machine. The only exception is the opt-in Fetch logos button.">local only</span>
  </header>
  <main>
    <section id="view"><div class="empty">Loading your network…</div></section>
    <aside class="panel" id="panel"></aside>
  </main>
  <script src="/static/vendor/force-graph.min.js"></script>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
